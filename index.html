<html>
<head>
<style>
  body {
    background-color: #f0f0f0;
    font-family: Arial;
    text-align: center;
  }
  .card {
    background: white;
    width: 300px;
    margin: 50px auto;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 10px grey;
  }
  h1 {
    color: #4a00e0;
  }
  p {
    color: #555;
    font-size: 16px;
  }
  button {
    background: #4a00e0;
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
  }
</style>
</head>
<body>

<div class="card">
  <h1>Lakshmi</h1>
  <p>B.Tech Student</p>
  <p>Kurabalakota, Andhra Pradesh</p>
  <p>I love Coding and Designing</p>
  <button>Contact Me</button>
</div>

</body>
</html>
